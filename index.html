<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enhanced Yes or No Game</title>
    <style>
        :root {
            --primary-color: #6246ea;
            --secondary-color: #e45858;
            --accent-color: #3da9fc;
            --background-light: #fffffe;
            --background-dark: #1b1b1e;
            --text-light: #2b2c34;
            --text-dark: #fffffe;
        }

        @keyframes flash {
            0%, 100% { opacity: 0.1; }
            50% { opacity: 0.3; }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background-color 0.3s ease, color 0.3s ease;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                radial-gradient(circle, var(--primary-color) 2px, transparent 2px),
                radial-gradient(circle, var(--secondary-color) 2px, transparent 2px),
                radial-gradient(circle, var(--accent-color) 2px, transparent 2px);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px, 15px 15px;
            opacity: 0.1;
            z-index: -1;
            transition: opacity 1s ease;
        }

        body.winner-yes::before,
        body.winner-no::before,
        body.winner-tie::before {
            opacity: 0.05;
        }

        body.light-theme {
            background-color: var(--background-light);
            color: var(--text-light);
        }

        body.dark-theme {
            background-color: var(--background-dark);
            color: var(--text-dark);
        }

        body.winner-yes {
            background: linear-gradient(135deg, #064e3b 0%, #065f46 50%, #047857 100%);
            transition: background 1s ease;
        }

        body.winner-no {
            background: linear-gradient(135deg, #7f1d1d 0%, #991b1b 50%, #b91c1c 100%);
            transition: background 1s ease;
        }

        body.winner-tie {
            background: linear-gradient(135deg, #4c1d95 0%, #5b21b6 50%, #6d28d9 100%);
            transition: background 1s ease;
        }

        .question-mark {
            position: fixed;
            font-size: 24px;
            color: var(--primary-color);
            opacity: 0.1;
            animation: flash 2s infinite;
            z-index: -1;
            transition: all 0.3s ease;
            pointer-events: none;
        }

        .question-mark.hovered {
            opacity: 0.8;
            font-size: 40px;
            transform: scale(1.5) rotate(360deg);
            color: var(--accent-color);
            text-shadow: 0 0 20px var(--primary-color);
        }

        .container {
            text-align: center;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            background-color: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            transition: transform 0.3s ease, box-shadow 0.3s ease, border 0.3s ease;
            max-width: 400px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .container:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(98, 70, 234, 0.2);
        }

        .container.tension {
            animation: tensionPulse 1.5s ease-in-out infinite, shake 0.5s ease-in-out infinite;
            border: 2px solid var(--secondary-color);
            box-shadow: 0 0 30px rgba(228, 88, 88, 0.5), 0 0 60px rgba(228, 88, 88, 0.3);
        }

        @keyframes tensionPulse {
            0%, 100% {
                box-shadow: 0 0 30px rgba(228, 88, 88, 0.5), 0 0 60px rgba(228, 88, 88, 0.3);
            }
            50% {
                box-shadow: 0 0 50px rgba(228, 88, 88, 0.8), 0 0 100px rgba(228, 88, 88, 0.5);
            }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0) translateY(-5px); }
            10% { transform: translateX(-2px) translateY(-5px); }
            20% { transform: translateX(2px) translateY(-5px); }
            30% { transform: translateX(-2px) translateY(-5px); }
            40% { transform: translateX(2px) translateY(-5px); }
            50% { transform: translateX(0) translateY(-5px); }
        }

        .confetti-piece {
            position: fixed !important;
            width: 12px;
            height: 12px;
            z-index: 9999 !important;
            pointer-events: none;
            top: -30px !important;
            border-radius: 50%;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--primary-color);
            transition: all 0.3s ease;
        }

        h1.tension {
            color: var(--secondary-color);
            text-shadow: 0 0 20px rgba(228, 88, 88, 0.8);
            animation: headingPulse 0.8s ease-in-out infinite;
        }

        @keyframes headingPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .coin {
            width: 180px;
            height: 180px;
            background: linear-gradient(145deg, var(--primary-color), var(--accent-color));
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.8rem;
            font-weight: bold;
            color: white;
            cursor: pointer;
            margin: 2rem auto;
            transition: transform 0.5s ease, box-shadow 0.3s ease, background 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
        }

        .coin.tension {
            background: linear-gradient(145deg, var(--secondary-color), #ff6b6b);
            box-shadow: 0 0 40px rgba(228, 88, 88, 0.6);
            animation: coinTension 1s ease-in-out infinite;
        }

        @keyframes coinTension {
            0%, 100% { 
                transform: scale(1) rotate(0deg);
            }
            25% { 
                transform: scale(1.05) rotate(-3deg);
            }
            75% { 
                transform: scale(1.05) rotate(3deg);
            }
        }

        .coin::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                45deg,
                transparent,
                rgba(255, 255, 255, 0.1),
                transparent
            );
            transform: rotate(45deg);
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0% {
                transform: translateX(-100%) translateY(-100%) rotate(45deg);
            }
            100% {
                transform: translateX(100%) translateY(100%) rotate(45deg);
            }
        }

        .coin:hover {
            animation: pulse 0.6s ease-in-out infinite, glow 2s ease-in-out infinite;
        }

        .coin:active {
            transform: scale(0.95);
        }

        .coin.spin {
            animation: spin 1s ease-out;
        }

        @keyframes spin {
            0% { transform: rotateY(0) scale(1); }
            25% { transform: rotateY(360deg) scale(1.15); }
            50% { transform: rotateY(720deg) scale(1.3); }
            75% { transform: rotateY(1080deg) scale(1.15); }
            100% { transform: rotateY(1440deg) scale(1); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes confettiFall {
            0% {
                transform: translateY(0) translateX(0) rotate(0deg);
                opacity: 1;
            }
            25% {
                transform: translateY(25vh) translateX(-15px) rotate(180deg);
                opacity: 1;
            }
            50% {
                transform: translateY(50vh) translateX(15px) rotate(360deg);
                opacity: 1;
            }
            75% {
                transform: translateY(75vh) translateX(-10px) rotate(540deg);
                opacity: 0.7;
            }
            100% {
                transform: translateY(100vh) translateX(5px) rotate(720deg);
                opacity: 0;
            }
        }

        @keyframes glow {
            0%, 100% {
                box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2),
                            0 0 20px rgba(98, 70, 234, 0.3);
            }
            50% {
                box-shadow: 0 8px 25px rgba(98, 70, 234, 0.4),
                            0 0 40px rgba(98, 70, 234, 0.6);
            }
        }

        .result {
            font-size: 2rem;
            margin: 1rem 0;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.5s ease, transform 0.5s ease;
            color: var(--secondary-color);
            text-shadow: 0 0 10px rgba(228, 88, 88, 0.5);
        }

        .result.show {
            opacity: 1;
            transform: scale(1.1);
            animation: slideInUp 0.5s ease-out, pulse 0.8s ease-in-out 3;
        }

        .result.yes {
            color: #4ade80;
            text-shadow: 0 0 20px rgba(74, 222, 128, 0.6);
        }

        .result.no {
            color: #f87171;
            text-shadow: 0 0 20px rgba(248, 113, 113, 0.6);
        }

        .score {
            font-size: 1.2rem;
            margin-bottom: 1rem;
            color: var(--accent-color);
            transition: all 0.3s ease;
        }

        .score.tension {
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--secondary-color);
            text-shadow: 0 0 10px rgba(228, 88, 88, 0.6);
        }

        .tension-message {
            font-size: 1.3rem;
            font-weight: bold;
            color: #fbbf24;
            text-shadow: 0 0 15px rgba(251, 191, 36, 0.8);
            margin: 1rem 0;
            animation: blink 0.8s ease-in-out infinite;
            display: none;
        }

        .tension-message.show {
            display: block;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .progress-container {
            width: 100%;
            height: 10px;
            background-color: rgba(98, 70, 234, 0.2);
            border-radius: 5px;
            overflow: hidden;
            margin-bottom: 1rem;
        }

        .progress-bar {
            width: 0;
            height: 100%;
            background: linear-gradient(90deg, var(--primary-color), var(--accent-color));
            transition: width 0.5s ease;
            box-shadow: 0 0 10px rgba(98, 70, 234, 0.5);
            position: relative;
        }

        .progress-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.3),
                transparent
            );
            animation: progressShimmer 1.5s infinite;
        }

        @keyframes progressShimmer {
            0% {
                transform: translateX(-100%);
            }
            100% {
                transform: translateX(100%);
            }
        }

        .theme-toggle {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .theme-toggle:hover {
            background-color: var(--accent-color);
        }

        .reset-btn {
            background-color: var(--secondary-color);
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 1rem;
            transition: background-color 0.3s ease, transform 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .reset-btn:hover {
            background-color: var(--accent-color);
            transform: translateY(-2px);
        }

        .hidden {
            display: none;
        }

        /* Meaning setup styles */
        .meaning-setup {
            display: grid;
            grid-template-columns: 1fr;
            gap: 0.75rem;
            margin-bottom: 1rem;
            text-align: left;
        }

        .meaning-row {
            display: grid;
            gap: 0.35rem;
        }

        .meaning-setup label {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .meaning-setup input {
            padding: 0.6rem 0.75rem;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.06);
            color: inherit;
            outline: none;
        }

        .meaning-setup input::placeholder {
            opacity: 0.6;
        }

        .start-btn {
            margin-top: 0.25rem;
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 0.6rem 1rem;
            border-radius: 8px;
            cursor: pointer;
        }

        .decision {
            margin: 0.5rem 0 0.25rem 0;
            font-size: 1.05rem;
            min-height: 1.2rem; /* reserve space */
            color: #fbbf24;
            text-shadow: 0 0 8px rgba(251, 191, 36, 0.6);
        }

        .coin.disabled {
            filter: grayscale(0.4) brightness(0.7);
            cursor: not-allowed;
            box-shadow: none;
        }

        .fun-fact {
            font-size: 0.9rem;
            margin-top: 1rem;
            font-style: italic;
            color: var(--accent-color);
        }

        @media (max-width: 600px) {
            .container {
                padding: 1.5rem;
            }

            h1 {
                font-size: 2rem;
            }

            .coin {
                width: 150px;
                height: 150px;
                font-size: 1.5rem;
            }

            .result {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body class="dark-theme">
    <button class="theme-toggle" id="themeToggle">🌓</button>
    <div class="container" id="container">
        <h1 id="heading">Yes or No?</h1>
        <div class="meaning-setup" id="meaningSetup">
            <div class="meaning-row">
                <label for="yesMeaning">Yes stands for</label>
                <input type="text" id="yesMeaning" placeholder="e.g., Go East" maxlength="40" />
            </div>
            <div class="meaning-row">
                <label for="noMeaning">No stands for</label>
                <input type="text" id="noMeaning" placeholder="e.g., Go West" maxlength="40" />
            </div>
            <button class="start-btn" id="startBtn">Start</button>
        </div>
        <div class="tension-message" id="tensionMessage">⚡ TIE BREAKER! ⚡</div>
        <div class="coin disabled" id="coin" title="Click Start to enable">Flip</div>
        <div class="result" id="result"></div>
        <div class="decision" id="decision"></div>
        <div class="score" id="score"></div>
        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        <button class="reset-btn hidden" id="resetBtn">Play Again</button>
        <div class="fun-fact" id="funFact"></div>
    </div>

    <script>
        const coin = document.getElementById('coin');
        const result = document.getElementById('result');
        const score = document.getElementById('score');
        const progressBar = document.getElementById('progressBar');
        const resetBtn = document.getElementById('resetBtn');
        const themeToggle = document.getElementById('themeToggle');
        const funFact = document.getElementById('funFact');
        const container = document.getElementById('container');
        const heading = document.getElementById('heading');
        const tensionMessage = document.getElementById('tensionMessage');
    const meaningSetup = document.getElementById('meaningSetup');
    const yesMeaningInput = document.getElementById('yesMeaning');
    const noMeaningInput = document.getElementById('noMeaning');
    const startBtn = document.getElementById('startBtn');
    const decision = document.getElementById('decision');

    let flips = 0;
    let yesCount = 0;
    let noCount = 0;
    let gameStarted = false; // do not persist
    let yesMeaning = '';
    let noMeaning = '';

        const funFacts = [
            "The ancient Romans used to flip coins to make decisions.",
            "The probability of getting 10 heads in a row is about 0.1%.",
            "Some people use coin flips to make major life decisions!",
            "The longest coin-flipping streak on record is 39 consecutive heads.",
            "In statistics, coin flips are often used to explain probability concepts."
        ];

        coin.addEventListener('click', flipCoin);
        resetBtn.addEventListener('click', resetGame);
        themeToggle.addEventListener('click', toggleTheme);
        startBtn.addEventListener('click', startGame);

        function startGame() {
            // Read meanings; fallback defaults if empty
            yesMeaning = (yesMeaningInput.value || 'Yes choice').trim();
            noMeaning = (noMeaningInput.value || 'No choice').trim();
            gameStarted = true;
            meaningSetup.classList.add('hidden');
            coin.classList.remove('disabled');
            coin.title = '';
            decision.textContent = '';
        }

        function flipCoin() {
            if (!gameStarted) {
                // Brief nudge
                container.classList.add('tension');
                setTimeout(() => container.classList.remove('tension'), 500);
                return;
            }
            if (flips >= 3) {
                console.log('Game already finished, cannot flip more');
                return;
            }

            // Disable coin immediately
            coin.style.pointerEvents = 'none';
            coin.classList.add('spin');
            result.classList.remove('show', 'yes', 'no');

            // Create particle effect
            createParticles();

            setTimeout(() => {
                const randomResult = Math.random() < 0.5 ? 'Yes' : 'No';
                result.textContent = randomResult;
                result.classList.add('show');
                
                // Add color class based on result
                if (randomResult === 'Yes') {
                    result.classList.add('yes');
                    yesCount++;
                } else {
                    result.classList.add('no');
                    noCount++;
                }

                flips++;
                updateScore();
                updateProgressBar();
                checkTension();

                coin.classList.remove('spin');

                if (flips >= 3) {
                    endGame();
                } else {
                    // Re-enable coin for next flip
                    coin.style.pointerEvents = 'auto';
                }
            }, 1000);
        }

        function checkTension() {
            // Check if it's tied 1-1 after 2 flips
            if (flips === 2 && yesCount === 1 && noCount === 1) {
                // TENSION MODE ACTIVATED!
                container.classList.add('tension');
                heading.classList.add('tension');
                coin.classList.add('tension');
                score.classList.add('tension');
                tensionMessage.classList.add('show');
                
                // Change coin text
                coin.textContent = '🔥 DECIDE! 🔥';
                
                console.log('⚡⚡⚡ TENSION MODE ACTIVATED! ⚡⚡⚡');
            }
        }

        function clearTension() {
            container.classList.remove('tension');
            heading.classList.remove('tension');
            coin.classList.remove('tension');
            score.classList.remove('tension');
            tensionMessage.classList.remove('show');
            coin.textContent = 'Flip';
        }

        function updateScore() {
            score.textContent = `Flips: ${flips}/3 | Yes: ${yesCount} | No: ${noCount}`;
        }

        function updateProgressBar() {
            progressBar.style.width = `${(flips / 3) * 100}%`;
        }

        function endGame() {
            coin.classList.add('hidden');
            coin.style.pointerEvents = 'none';
            resetBtn.classList.remove('hidden');
            
            // Determine winner
            const winner = yesCount > noCount ? 'Yes' : (noCount > yesCount ? 'No' : 'Tie');
            result.textContent = `Game Over! ${winner} wins!`;
            result.classList.remove('yes', 'no');
            
            // Change background based on winner
            changeBackgroundForWinner(winner);

            // Display mapped decision quickly, without storing anywhere
            if (winner === 'Yes') {
                decision.textContent = `Decision: ${yesMeaning}`;
            } else if (winner === 'No') {
                decision.textContent = `Decision: ${noMeaning}`;
            } else {
                decision.textContent = 'Decision: It’s a tie — up to you!';
            }
            
            showRandomFunFact();
            
            // Celebration confetti with slight delay
            setTimeout(() => {
                createConfetti();
            }, 200);
        }

        function changeBackgroundForWinner(winner) {
            // Remove all winner classes first
            document.body.classList.remove('winner-yes', 'winner-no', 'winner-tie');
            
            // Add appropriate winner class
            if (winner === 'Yes') {
                document.body.classList.add('winner-yes');
                result.classList.add('yes');
                console.log('🟢 Background changed to GREEN for YES winner!');
            } else if (winner === 'No') {
                document.body.classList.add('winner-no');
                result.classList.add('no');
                console.log('🔴 Background changed to RED for NO winner!');
            } else {
                document.body.classList.add('winner-tie');
                console.log('🟣 Background changed to PURPLE for TIE!');
            }
        }

        function resetGame() {
            flips = 0;
            yesCount = 0;
            noCount = 0;
            gameStarted = false;
            yesMeaning = '';
            noMeaning = '';
            coin.classList.remove('hidden');
            coin.style.pointerEvents = 'auto';
            coin.textContent = 'Flip';
            coin.classList.add('disabled');
            resetBtn.classList.add('hidden');
            result.textContent = '';
            result.classList.remove('show', 'yes', 'no');
            funFact.textContent = '';
            decision.textContent = '';
            clearTension();
            
              // Reset background to default
              document.body.classList.remove('winner-yes', 'winner-no', 'winner-tie');
            // Show setup again
            meaningSetup.classList.remove('hidden');
            
              updateScore();
              updateProgressBar();
        }

        function toggleTheme() {
            document.body.classList.toggle('light-theme');
            document.body.classList.toggle('dark-theme');
        }

        function showRandomFunFact() {
            const randomFact = funFacts[Math.floor(Math.random() * funFacts.length)];
            funFact.textContent = `Fun Fact: ${randomFact}`;
        }

        // Initialize the score display
        updateScore();

        // Create flashing question marks
        function createQuestionMarks() {
            const numQuestionMarks = 50;
            const questionMarks = [];
            
            for (let i = 0; i < numQuestionMarks; i++) {
                const questionMark = document.createElement('div');
                questionMark.textContent = '?';
                questionMark.classList.add('question-mark');
                questionMark.style.left = `${Math.random() * 100}vw`;
                questionMark.style.top = `${Math.random() * 100}vh`;
                questionMark.style.animationDelay = `${Math.random() * 2}s`;
                document.body.appendChild(questionMark);
                questionMarks.push(questionMark);
            }

            // Track mouse movement and highlight nearby question marks
            document.addEventListener('mousemove', (e) => {
                const mouseX = e.clientX;
                const mouseY = e.clientY;
                const hoverRadius = 150; // pixels

                questionMarks.forEach(mark => {
                    const rect = mark.getBoundingClientRect();
                    const markX = rect.left + rect.width / 2;
                    const markY = rect.top + rect.height / 2;
                    
                    // Calculate distance from cursor to question mark
                    const distance = Math.sqrt(
                        Math.pow(mouseX - markX, 2) + Math.pow(mouseY - markY, 2)
                    );

                    // If within hover radius, add hovered class
                    if (distance < hoverRadius) {
                        mark.classList.add('hovered');
                    } else {
                        mark.classList.remove('hovered');
                    }
                });
            });
        }

        createQuestionMarks();

        // Particle effect function
        function createParticles() {
            const colors = ['#6246ea', '#e45858', '#3da9fc', '#4ade80', '#fbbf24'];
            const particleCount = 20;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.style.position = 'absolute';
                particle.style.width = '8px';
                particle.style.height = '8px';
                particle.style.borderRadius = '50%';
                particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                particle.style.pointerEvents = 'none';
                
                const rect = coin.getBoundingClientRect();
                particle.style.left = rect.left + rect.width / 2 + 'px';
                particle.style.top = rect.top + rect.height / 2 + 'px';
                particle.style.zIndex = '1000';
                
                document.body.appendChild(particle);
                
                const angle = (Math.PI * 2 * i) / particleCount;
                const velocity = 100 + Math.random() * 100;
                const tx = Math.cos(angle) * velocity;
                const ty = Math.sin(angle) * velocity;
                
                particle.animate([
                    { 
                        transform: 'translate(0, 0) scale(1)', 
                        opacity: 1 
                    },
                    { 
                        transform: `translate(${tx}px, ${ty}px) scale(0)`, 
                        opacity: 0 
                    }
                ], {
                    duration: 800,
                    easing: 'cubic-bezier(0, .9, .57, 1)'
                });
                
                setTimeout(() => particle.remove(), 800);
            }
        }

        // Confetti effect function
        function createConfetti() {
            console.log('🎊 Creating confetti celebration!');
            const colors = ['#6246ea', '#e45858', '#3da9fc', '#4ade80', '#fbbf24', '#f87171', '#a78bfa', '#fb923c'];
            const confettiCount = 150;
            
            for (let i = 0; i < confettiCount; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    const color = colors[Math.floor(Math.random() * colors.length)];
                    
                    confetti.className = 'confetti-piece';
                    confetti.style.left = (Math.random() * 100) + 'vw';
                    confetti.style.backgroundColor = color;
                    confetti.style.width = (8 + Math.random() * 8) + 'px';
                    confetti.style.height = (8 + Math.random() * 8) + 'px';
                    
                    const duration = 2.5 + Math.random() * 1.5;
                    
                    confetti.style.animation = `confettiFall ${duration}s linear forwards`;
                    
                    document.body.appendChild(confetti);
                    
                    setTimeout(() => {
                        confetti.remove();
                    }, duration * 1000 + 100);
                }, i * 10);
            }
        }
    </script>
</body>
