<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oracle Coin | Tension Mode</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.6);
            --primary: #8b5cf6;
            --primary-glow: rgba(139, 92, 246, 0.5);
            --success: #10b981;
            --danger: #ef4444;
            --gold: #fbbf24;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --coin-size: 160px;
            --coin-thickness: 10px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            perspective: 1000px;
            transition: background-color 0.5s ease;
        }

        /* --- ANIMATED BACKGROUND --- */
        .ambient-bg {
            position: fixed;
            inset: 0;
            z-index: -2;
            background: linear-gradient(125deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
            background-size: 400% 400%;
            animation: gradientPulse 15s ease infinite;
            transition: all 1s ease;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.6;
            animation: orbFloat 20s infinite alternate;
            transition: all 1s ease;
        }

        .orb-1 {
            top: -10%; left: -10%; width: 50vw; height: 50vw;
            background: var(--primary);
        }
        .orb-2 {
            bottom: -10%; right: -10%; width: 50vw; height: 50vw;
            background: #3b82f6;
            animation-delay: -5s;
        }

        /* --- TENSION MODE STYLES (1-1 TIE) --- */
        /* Background becomes a split battlefield: Dark Green vs Dark Red */
        body.tension-active .ambient-bg {
            background: linear-gradient(115deg, #064e3b 0%, #000000 50%, #7f1d1d 100%);
            background-size: 100% 100%;
            animation: none;
        }
        
        /* Orb 1 becomes Green (Top Left) */
        body.tension-active .orb-1 { 
            background: var(--success); 
            opacity: 0.5;
            filter: blur(100px);
            transform: scale(1.2);
        }
        
        /* Orb 2 becomes Red (Bottom Right) */
        body.tension-active .orb-2 { 
            background: var(--danger); 
            opacity: 0.5;
            filter: blur(100px);
            transform: scale(1.2);
        }
        
        body.tension-active .interface {
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: -20px -20px 60px rgba(16, 185, 129, 0.2), 
                        20px 20px 60px rgba(239, 68, 68, 0.2);
        }
        
        body.tension-active h1 {
            background: linear-gradient(to right, var(--success), #fff, var(--danger));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .tension-warning {
            display: none;
            color: #fff;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 1rem;
            margin-bottom: 1.5rem;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
            animation: blink 0.5s infinite;
        }
        body.tension-active .tension-warning { display: block; }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        /* --- END TENSION STYLES --- */

        .stars-container {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0;
            animation: starRise linear infinite;
        }

        @keyframes gradientPulse {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes orbFloat {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 30px) scale(1.1); }
        }

        @keyframes starRise {
            0% { transform: translateY(110vh) scale(0); opacity: 0; }
            20% { opacity: 0.7; }
            80% { opacity: 0.7; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        /* Win States */
        body.state-yes .orb-1, body.state-yes .orb-2 { background: var(--success); opacity: 0.6; }
        body.state-no .orb-1, body.state-no .orb-2 { background: var(--danger); opacity: 0.6; }

        /* Main Card */
        .interface {
            position: relative;
            width: 90%;
            max-width: 440px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: all 0.5s ease;
            z-index: 10;
        }

        .header { text-align: center; margin-bottom: 2rem; }

        h1 {
            font-weight: 900;
            font-size: 2rem;
            letter-spacing: -1px;
            background: linear-gradient(to right, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
            transition: all 0.3s ease;
        }

        .subtitle { font-size: 0.9rem; color: var(--text-muted); font-weight: 300; }

        /* Coin */
        .coin-stage {
            width: var(--coin-size);
            height: var(--coin-size);
            margin: 0 auto 2rem;
            perspective: 1000px;
            cursor: pointer;
            position: relative;
        }

        .coin {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 3s cubic-bezier(0.15, 0.9, 0.34, 1);
        }

        .coin.disabled { pointer-events: none; filter: grayscale(0.5); }

        .coin-face {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            backface-visibility: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.3);
            border: 4px solid rgba(255,255,255,0.1);
        }

        .coin-front {
            background: linear-gradient(135deg, var(--primary), #4c1d95);
            color: white;
            transform: rotateY(0deg);
        }
        
        .coin-back {
            background: linear-gradient(135deg, var(--danger), #991b1b);
            color: white;
            transform: rotateY(180deg);
        }

        .face-content {
            font-size: 2.5rem;
            font-weight: 900;
            text-transform: uppercase;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        .coin-edge {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border-radius: 50%;
            transform: translateZ(calc(var(--coin-thickness) * -0.5));
        }
        
        /* Inputs & Buttons */
        .setup-panel {
            display: grid;
            gap: 1rem;
            transition: opacity 0.3s ease, height 0.3s ease;
        }
        
        .setup-panel.collapsed { opacity: 0; height: 0; overflow: hidden; pointer-events: none; margin: 0; }

        .input-group { position: relative; }

        input {
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(148, 163, 184, 0.2);
            color: white;
            padding: 1rem;
            border-radius: 12px;
            font-family: inherit;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus { border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary-glow); }

        .btn-main {
            width: 100%;
            padding: 1rem;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-family: inherit;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-start { background: var(--text-main); color: var(--bg-color); }
        .btn-start:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(255,255,255,0.2); }

        .btn-reset { background: rgba(255,255,255,0.1); color: white; margin-top: 1rem; }
        .btn-reset:hover { background: rgba(255,255,255,0.2); }

        /* HUD */
        .hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            color: var(--text-muted);
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.5s ease;
        }
        .hud.active { opacity: 1; transform: translateY(0); }

        .score-pills { display: flex; gap: 0.5rem; }
        .pill { padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; }
        .pill-yes { background: rgba(16, 185, 129, 0.2); color: var(--success); }
        .pill-no { background: rgba(239, 68, 68, 0.2); color: var(--danger); }

        /* Text & Confetti */
        .result-container { text-align: center; min-height: 80px; margin-bottom: 1rem; }

        .decision-text {
            font-size: 1.25rem;
            font-weight: 500;
            color: var(--gold);
            text-shadow: 0 0 20px rgba(251, 191, 36, 0.4);
            opacity: 0;
            transform: scale(0.9);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .decision-text.visible { opacity: 1; transform: scale(1); }

        .shockwave {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 160px; height: 160px; border-radius: 50%; border: 2px solid white;
            opacity: 0; pointer-events: none;
        }
        .shockwave.active { animation: ripple 0.6s ease-out; }

        @keyframes ripple {
            0% { width: 160px; height: 160px; opacity: 0.8; border-width: 10px; }
            100% { width: 400px; height: 400px; opacity: 0; border-width: 0px; }
        }

        .confetti { position: fixed; width: 10px; height: 10px; z-index: 100; pointer-events: none; }
        .hidden { display: none !important; }

    </style>
</head>
<body>

    <div class="ambient-bg">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>
    <div class="stars-container" id="starsContainer"></div>

    <div class="interface" id="gameCard">
        <div class="header">
            <h1>ORACLE</h1>
            <div class="subtitle">Define your destiny. Best of 3.</div>
        </div>

        <!-- Tension Message -->
        <div class="tension-warning">⚠ FINAL DECISION REQUIRED ⚠</div>

        <div class="setup-panel" id="setupPanel">
            <div class="input-group">
                <input type="text" id="yesInput" placeholder="If Yes: e.g., Order Pizza" maxlength="30" autocomplete="off">
            </div>
            <div class="input-group">
                <input type="text" id="noInput" placeholder="If No: e.g., Cook Salad" maxlength="30" autocomplete="off">
            </div>
            <button class="btn-main btn-start" id="startBtn">Initiate Sequence</button>
        </div>

        <div class="hud" id="hud">
            <span id="flipCounter">FLIP 1 / 3</span>
            <div class="score-pills">
                <div class="pill pill-yes" id="scoreYes">YES: 0</div>
                <div class="pill pill-no" id="scoreNo">NO: 0</div>
            </div>
        </div>

        <div class="coin-stage">
            <div class="coin disabled" id="coin">
                <div class="coin-face coin-front">
                    <div class="face-content">YES</div>
                </div>
                <div class="coin-face coin-back">
                    <div class="face-content">NO</div>
                </div>
                <div class="coin-edge"></div>
            </div>
            <div class="shockwave" id="shockwave"></div>
        </div>

        <div class="result-container">
            <div class="decision-text" id="decisionText"></div>
        </div>

        <button class="btn-main btn-reset hidden" id="resetBtn">Reset System</button>
    </div>

    <script>
        const coin = document.getElementById('coin');
        const startBtn = document.getElementById('startBtn');
        const resetBtn = document.getElementById('resetBtn');
        const setupPanel = document.getElementById('setupPanel');
        const hud = document.getElementById('hud');
        const decisionText = document.getElementById('decisionText');
        const shockwave = document.getElementById('shockwave');
        const starsContainer = document.getElementById('starsContainer');
        
        let gameState = {
            active: false,
            flips: 0,
            yes: 0,
            no: 0,
            meanings: { yes: '', no: '' },
            rotation: 0
        };

        const MAX_FLIPS = 3;

        function createStars() {
            const starCount = 40;
            for(let i=0; i<starCount; i++) {
                const star = document.createElement('div');
                star.classList.add('star');
                star.style.left = Math.random() * 100 + 'vw';
                const size = Math.random() * 3 + 1;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.animationDuration = (Math.random() * 10 + 5) + 's';
                star.style.animationDelay = (Math.random() * 5) + 's';
                starsContainer.appendChild(star);
            }
        }
        createStars();

        startBtn.addEventListener('click', initGame);
        coin.addEventListener('click', handleFlip);
        resetBtn.addEventListener('click', resetGame);

        function initGame() {
            const yesVal = document.getElementById('yesInput').value.trim();
            const noVal = document.getElementById('noInput').value.trim();
            
            gameState.meanings.yes = yesVal || "The Oracle says YES";
            gameState.meanings.no = noVal || "The Oracle says NO";
            
            setupPanel.classList.add('collapsed');
            hud.classList.add('active');
            coin.classList.remove('disabled');
            gameState.active = true;
            
            coin.animate([
                { transform: 'scale(1)' },
                { transform: 'scale(1.05)' },
                { transform: 'scale(1)' }
            ], { duration: 400 });
        }

        function handleFlip() {
            if (!gameState.active || gameState.flips >= MAX_FLIPS) return;

            coin.style.pointerEvents = 'none';
            decisionText.classList.remove('visible');
            
            const isYes = Math.random() > 0.5;
            const loops = 5; 
            const baseRotation = 360 * loops;
            
            let targetRotation;
            if (isYes) {
                targetRotation = gameState.rotation + baseRotation + (360 - (gameState.rotation % 360));
            } else {
                targetRotation = gameState.rotation + baseRotation + (180 - (gameState.rotation % 360)) + 360; 
            }
            
            if(isYes && targetRotation % 360 !== 0) targetRotation += (360 - (targetRotation % 360));
            if(!isYes && targetRotation % 360 !== 180) {
                 const remainder = targetRotation % 360;
                 targetRotation += (180 - remainder) + 360;
            }

            gameState.rotation = targetRotation;
            coin.style.transform = `rotateY(${gameState.rotation}deg)`;

            setTimeout(() => {
                finishFlip(isYes);
            }, 3000);
        }

        function finishFlip(isYes) {
            triggerShockwave();
            
            gameState.flips++;
            if (isYes) gameState.yes++; else gameState.no++;
            
            updateHUD();
            
            decisionText.textContent = isYes ? "YES" : "NO";
            decisionText.style.color = isYes ? 'var(--success)' : 'var(--danger)';
            decisionText.classList.add('visible');

            // CHECK FOR TENSION (1-1 Score, 2 flips done)
            if (gameState.flips === 2 && gameState.yes === 1 && gameState.no === 1) {
                activateTension();
                coin.style.pointerEvents = 'auto'; // allow final click
                return; // Wait for final flip
            }

            if (gameState.flips >= MAX_FLIPS) {
                endGame();
            } else {
                coin.style.pointerEvents = 'auto';
            }
        }

        function activateTension() {
            setTimeout(() => {
                document.body.classList.add('tension-active');
            }, 500);
        }

        function updateHUD() {
            document.getElementById('flipCounter').textContent = `FLIP ${Math.min(gameState.flips + 1, 3)} / 3`;
            document.getElementById('scoreYes').textContent = `YES: ${gameState.yes}`;
            document.getElementById('scoreNo').textContent = `NO: ${gameState.no}`;
        }

        function triggerShockwave() {
            shockwave.classList.remove('active');
            void shockwave.offsetWidth;
            shockwave.classList.add('active');
        }

        function endGame() {
            document.body.classList.remove('tension-active');
            const winner = gameState.yes > gameState.no ? 'yes' : 'no';
            
            setTimeout(() => {
                document.body.classList.add(`state-${winner}`);
                
                let finalMessage = winner === 'yes' ? gameState.meanings.yes : gameState.meanings.no;
                decisionText.innerHTML = `<span style="display:block; font-size: 0.8em; opacity: 0.7; margin-bottom:5px">THE ORACLE DECREES</span>${finalMessage}`;
                
                resetBtn.classList.remove('hidden');
                createConfetti(winner === 'yes' ? '#10b981' : '#ef4444');
            }, 500);
        }

        function resetGame() {
            gameState = { ...gameState, active: false, flips: 0, yes: 0, no: 0, rotation: 0 };
            
            document.body.classList.remove('state-yes', 'state-no', 'tension-active');
            setupPanel.classList.remove('collapsed');
            hud.classList.remove('active');
            resetBtn.classList.add('hidden');
            decisionText.classList.remove('visible');
            
            // --- FIX START ---
            coin.style.pointerEvents = 'auto'; // Fixes the bug where coin was unclickable
            // --- FIX END ---
            
            coin.classList.add('disabled');
            coin.style.transform = 'rotateY(0deg)';
            
            document.getElementById('scoreYes').textContent = "YES: 0";
            document.getElementById('scoreNo').textContent = "NO: 0";
            document.getElementById('flipCounter').textContent = "FLIP 1 / 3";
        }

        function createConfetti(color) {
            const count = 100;
            for(let i=0; i<count; i++) {
                const particle = document.createElement('div');
                particle.classList.add('confetti');
                document.body.appendChild(particle);
                
                const x = Math.random() * window.innerWidth;
                const y = -10;
                
                particle.style.left = x + 'px';
                particle.style.top = y + 'px';
                particle.style.background = Math.random() > 0.5 ? color : '#fbbf24';
                particle.style.transform = `rotate(${Math.random() * 360}deg)`;
                
                const animation = particle.animate([
                    { transform: `translate(0,0) rotate(0)`, opacity: 1 },
                    { transform: `translate(${Math.random()*200 - 100}px, ${window.innerHeight}px) rotate(${Math.random()*720}deg)`, opacity: 0 }
                ], {
                    duration: 1500 + Math.random() * 1500,
                    easing: 'cubic-bezier(0.25, 1, 0.5, 1)'
                });
                
                animation.onfinish = () => particle.remove();
            }
        }
    </script>
</body>
</html>
