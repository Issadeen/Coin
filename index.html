<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enhanced Yes or No Game</title>
    <style>
        :root {
            --primary-color: #6246ea;
            --secondary-color: #e45858;
            --accent-color: #3da9fc;
            --background-light: #fffffe;
            --background-dark: #1b1b1e;
            --text-light: #2b2c34;
            --text-dark: #fffffe;
        }

        @keyframes flash {
            0%, 100% { opacity: 0.1; }
            50% { opacity: 0.3; }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background-color 0.3s ease, color 0.3s ease;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                radial-gradient(circle, var(--primary-color) 2px, transparent 2px),
                radial-gradient(circle, var(--secondary-color) 2px, transparent 2px),
                radial-gradient(circle, var(--accent-color) 2px, transparent 2px);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px, 15px 15px;
            opacity: 0.1;
            z-index: -1;
        }

        body.light-theme {
            background-color: var(--background-light);
            color: var(--text-light);
        }

        body.dark-theme {
            background-color: var(--background-dark);
            color: var(--text-dark);
        }

        .question-mark {
            position: fixed;
            font-size: 24px;
            color: var(--primary-color);
            opacity: 0.1;
            animation: flash 2s infinite;
            z-index: -1;
        }

        .container {
            text-align: center;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            background-color: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            transition: transform 0.3s ease;
            max-width: 400px;
            width: 100%;
        }

        .container:hover {
            transform: translateY(-5px);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--primary-color);
        }

        .coin {
            width: 180px;
            height: 180px;
            background: linear-gradient(145deg, var(--primary-color), var(--accent-color));
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.8rem;
            font-weight: bold;
            color: white;
            cursor: pointer;
            margin: 2rem auto;
            transition: transform 0.5s ease, box-shadow 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .coin:hover {
            box-shadow: 0 8px 25px rgba(98, 70, 234, 0.3);
        }

        .coin.spin {
            animation: spin 1s ease-out;
        }

        @keyframes spin {
            0% { transform: rotateY(0) scale(1); }
            50% { transform: rotateY(720deg) scale(1.2); }
            100% { transform: rotateY(1440deg) scale(1); }
        }

        .result {
            font-size: 2rem;
            margin: 1rem 0;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.5s ease, transform 0.5s ease;
            color: var(--secondary-color);
        }

        .result.show {
            opacity: 1;
            transform: scale(1.1);
        }

        .score {
            font-size: 1.2rem;
            margin-bottom: 1rem;
            color: var(--accent-color);
        }

        .progress-container {
            width: 100%;
            height: 10px;
            background-color: rgba(98, 70, 234, 0.2);
            border-radius: 5px;
            overflow: hidden;
            margin-bottom: 1rem;
        }

        .progress-bar {
            width: 0;
            height: 100%;
            background-color: var(--primary-color);
            transition: width 0.5s ease;
        }

        .theme-toggle {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .theme-toggle:hover {
            background-color: var(--accent-color);
        }

        .reset-btn {
            background-color: var(--secondary-color);
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 1rem;
            transition: background-color 0.3s ease, transform 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .reset-btn:hover {
            background-color: var(--accent-color);
            transform: translateY(-2px);
        }

        .hidden {
            display: none;
        }

        .fun-fact {
            font-size: 0.9rem;
            margin-top: 1rem;
            font-style: italic;
            color: var(--accent-color);
        }

        @media (max-width: 600px) {
            .container {
                padding: 1.5rem;
            }

            h1 {
                font-size: 2rem;
            }

            .coin {
                width: 150px;
                height: 150px;
                font-size: 1.5rem;
            }

            .result {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body class="light-theme">
    <button class="theme-toggle" id="themeToggle">🌓</button>
    <div class="container">
        <h1>Yes or No?</h1>
        <div class="coin" id="coin">Flip</div>
        <div class="result" id="result"></div>
        <div class="score" id="score"></div>
        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        <button class="reset-btn hidden" id="resetBtn">Play Again</button>
        <div class="fun-fact" id="funFact"></div>
    </div>

    <script>
        const coin = document.getElementById('coin');
        const result = document.getElementById('result');
        const score = document.getElementById('score');
        const progressBar = document.getElementById('progressBar');
        const resetBtn = document.getElementById('resetBtn');
        const themeToggle = document.getElementById('themeToggle');
        const funFact = document.getElementById('funFact');

        let flips = 0;
        let yesCount = 0;
        let noCount = 0;

        const funFacts = [
            "The ancient Romans used to flip coins to make decisions.",
            "The probability of getting 10 heads in a row is about 0.1%.",
            "Some people use coin flips to make major life decisions!",
            "The longest coin-flipping streak on record is 39 consecutive heads.",
            "In statistics, coin flips are often used to explain probability concepts."
        ];

        coin.addEventListener('click', flipCoin);
        resetBtn.addEventListener('click', resetGame);
        themeToggle.addEventListener('click', toggleTheme);

        function flipCoin() {
            if (flips >= 3) return;

            coin.classList.add('spin');
            result.classList.remove('show');

            setTimeout(() => {
                const randomResult = Math.random() < 0.5 ? 'Yes' : 'No';
                result.textContent = randomResult;
                result.classList.add('show');

                if (randomResult === 'Yes') yesCount++;
                else noCount++;

                flips++;
                updateScore();
                updateProgressBar();

                if (flips === 3) {
                    endGame();
                }

                coin.classList.remove('spin');
            }, 1000);
        }

        function updateScore() {
            score.textContent = `Flips: ${flips}/3 | Yes: ${yesCount} | No: ${noCount}`;
        }

        function updateProgressBar() {
            progressBar.style.width = `${(flips / 3) * 100}%`;
        }

        function endGame() {
            coin.classList.add('hidden');
            resetBtn.classList.remove('hidden');
            const winner = yesCount > noCount ? 'Yes' : (noCount > yesCount ? 'No' : 'Tie');
            result.textContent = `Game Over! ${winner} wins!`;
            showRandomFunFact();
        }

        function resetGame() {
            flips = 0;
            yesCount = 0;
            noCount = 0;
            coin.classList.remove('hidden');
            resetBtn.classList.add('hidden');
            result.textContent = '';
            result.classList.remove('show');
            funFact.textContent = '';
            updateScore();
            updateProgressBar();
        }

        function toggleTheme() {
            document.body.classList.toggle('light-theme');
            document.body.classList.toggle('dark-theme');
        }

        function showRandomFunFact() {
            const randomFact = funFacts[Math.floor(Math.random() * funFacts.length)];
            funFact.textContent = `Fun Fact: ${randomFact}`;
        }

        // Initialize the score display
        updateScore();

        // Create flashing question marks
        function createQuestionMarks() {
            const numQuestionMarks = 50;
            for (let i = 0; i < numQuestionMarks; i++) {
                const questionMark = document.createElement('div');
                questionMark.textContent = '?';
                questionMark.classList.add('question-mark');
                questionMark.style.left = `${Math.random() * 100}vw`;
                questionMark.style.top = `${Math.random() * 100}vh`;
                questionMark.style.animationDelay = `${Math.random() * 2}s`;
                document.body.appendChild(questionMark);
            }
        }

        createQuestionMarks();
    </script>
</body>
</html>
